inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rake
  - rubocop-rails

AllCops:
  TargetRubyVersion: 3.3
  TargetRailsVersion: 8.0
  NewCops: enable

Gemspec/RequireMFA:
  Enabled: false

Layout/IndentationConsistency:
  EnforcedStyle: indented_internal_methods

Metrics/BlockLength:
  Exclude:
    - 'test/**/*.rb'

Rails/RakeEnvironment:
  Enabled: false
